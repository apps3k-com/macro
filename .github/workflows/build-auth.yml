name: Build Studio3000 authentication service
on:
  push:
    branches: [studio3000-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_COMMIT: 8d042f66eab84cde33170a77c494bd6dd678dcfa
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Free space on the disposable Linux runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build Linux image
        run: |
          set -eu
          docker build -f docker/Dockerfile --build-arg SERVICE_NAME=authentication_service \
            --label org.opencontainers.image.revision="$SOURCE_COMMIT" \
            -t "macro-auth:$SOURCE_COMMIT" .
          docker image save "macro-auth:$SOURCE_COMMIT" | gzip -1 > "$RUNNER_TEMP/macro-auth.tar.gz"
          cd "$RUNNER_TEMP"
          sha256sum macro-auth.tar.gz > macro-auth.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macro-auth-linux-amd64
          path: |
            ${{ runner.temp }}/macro-auth.tar.gz
            ${{ runner.temp }}/macro-auth.tar.gz.sha256
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
