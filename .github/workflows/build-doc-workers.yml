name: Build Studio3000 collaborative document workers
on:
  push:
    branches: [codex/document-workers]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        service: [sync-service]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SERVICE: ${{ matrix.service }}
      SOURCE_COMMIT: 482971b54f086fd17d1fa648a390df16c21af6f4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Free space on the disposable Linux runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build Linux image
        run: |
          set -eu
          docker build -f "docker/$SERVICE.Dockerfile" \
            --label org.opencontainers.image.revision="$SOURCE_COMMIT" \
            -t "macro-studio/$SERVICE:$SOURCE_COMMIT" .
          docker image save "macro-studio/$SERVICE:$SOURCE_COMMIT" | gzip -1 > "$RUNNER_TEMP/macro-service.tar.gz"
          cd "$RUNNER_TEMP"
          sha256sum macro-service.tar.gz > macro-service.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-${{ matrix.service }}-linux-amd64
          path: |
            ${{ runner.temp }}/macro-service.tar.gz
            ${{ runner.temp }}/macro-service.tar.gz.sha256
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
