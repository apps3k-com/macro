name: Build Studio3000 Android release bundle
on:
  push:
    branches: [codex/android-release]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6e462e766708a0d5dd16bca56e8b4a3f1839e253
          persist-credentials: false
      - name: Install the pinned Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.16248370'
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-nix
      - uses: ./.github/actions/setup-reqs-web
      - name: Build release bundle for offline signing
        working-directory: apps/web
        env:
          FIREBASE_CLIENT: ${{ secrets.MACRO_ANDROID_FIREBASE_CLIENT }}
        run: |
          set -euo pipefail
          umask 077
          unset BASH_ENV
          export RUSTC_WRAPPER=""
          printf '%s' "$FIREBASE_CLIENT" > "$RUNNER_TEMP/google-services.json"
          unset FIREBASE_CLIENT
          android=tauri/src-tauri/gen/android
          ephemeral=$(openssl rand -hex 28)
          keytool -genkeypair -keystore "$RUNNER_TEMP/temporary.p12" -alias temporary -storepass "$ephemeral" -keypass "$ephemeral" -keyalg RSA -keysize 2048 -validity 2 -dname CN=Temporary
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=temporary\n' "$RUNNER_TEMP/temporary.p12" "$ephemeral" "$ephemeral" > "$android/keystore.properties"
          args=(--aab)
          if [[ "$(cargo tauri android build --help)" == *'--aab <AAB>'* ]]; then
            args=(--apk false --aab true)
          fi
          just android-build --firebase-config "$RUNNER_TEMP/google-services.json" --ci "${args[@]}"
          mapfile -t bundles < <(find "$android/app/build/outputs/bundle" -name '*.aab')
          [[ ${#bundles[@]} == 1 ]]
          cp "${bundles[0]}" "$RUNNER_TEMP/studio3000-unsigned.aab"
          cd "$RUNNER_TEMP"
          zip -dq studio3000-unsigned.aab 'META-INF/MANIFEST.MF' 'META-INF/*.SF' 'META-INF/*.RSA'
          unzip -tq studio3000-unsigned.aab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio3000-android-offline-signing
          path: ${{ runner.temp }}/studio3000-unsigned.aab
          if-no-files-found: error
          retention-days: 3
