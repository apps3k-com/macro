name: Verify Studio3000 iOS simulator release
on:
  push:
    branches: [codex/ios-simulator-acceptance]
permissions:
  actions: read
  contents: read
jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Restore the checksum-verified simulator bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          gh api repos/apps3k-com/macro/actions/artifacts/15129237276/zip > package.zip
          echo "7410bb5c3496af279da846cddd5fa245589f33d23c6968959e9ff3a44133e3b2  package.zip" | shasum -a 256 -c -
          unzip -q package.zip
          ditto -xk macro-simulator.zip .
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' macro.app/Info.plist)" = ch.studio3000.macro
      - name: Launch the compiled application in an iPhone simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; groups=json.load(sys.stdin)["devices"]; print(next(d["udid"] for k,devices in sorted(groups.items(),reverse=True) if "iOS-27" in k for d in devices if d["name"].startswith("iPhone") and d["isAvailable"]))')
          xcrun simctl bootstatus "$udid" -b
          app="macro.app"
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" ch.studio3000.macro
          sleep 15
          xcrun simctl spawn "$udid" launchctl list | awk '$1 ~ /^[0-9]+$/ && /ch[.]studio3000[.]macro/ {found=1} END{exit !found}'
          xcrun simctl io "$udid" screenshot --display=1 "$RUNNER_TEMP/ios-launch.png"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio3000-ios-launch
          path: ${{ runner.temp }}/ios-launch.png
          if-no-files-found: error
          retention-days: 3
